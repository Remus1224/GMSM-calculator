<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>也許有用的資訊｜楓之谷M 也許有用的工具</title>
  <meta name="description" content="楓之谷M 成長需求、等級門檻與系統資料整理。">
  <script>
    try {
      if (localStorage.getItem('msm-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="style.css?v=20260927-v5">
</head>
<body>
  <svg class="liquid-filter-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden;pointer-events:none">
    <defs>
      <filter id="liquid-optical-warp" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.010 0.021" numOctaves="1" seed="17" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="0.55" result="softNoise" />
        <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="shell">
    <header>
      <h1 class="site-title">楓之谷M 也許有用的工具</h1>
      <div class="top-nav">
        <div class="top-nav-side">
          <button id="nav-back" class="nav-btn glass-control" type="button">主選單</button>
        </div>
        <div id="nav-title" class="nav-title">也許有用的資訊</div>
        <div class="top-nav-side">
          <button id="theme-toggle" class="theme-btn glass-control" type="button" aria-label="切換至夜間模式" aria-pressed="false">🌙</button>
        </div>
      </div>
      <div class="beta-strip">BETA · 資料型資訊中心 V5</div>
    </header>

    <div id="app" aria-live="polite">
      <div class="glass-panel loading">正在載入資訊中心…</div>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="script.js?v=20260927-v5"></script>
</body>
</html>
