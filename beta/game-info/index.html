  <style id="p4f-background-polish">
    /* V21-P4F — Background / Chrome Polish.
       P3Q/P3S/P4D glass and interaction values stay protected.
       Light gains slightly tighter spatial detail; Dark stays nearly frozen. */
    :root{
      --page-base:#EEF1FA;
      --page-grad-cyan:rgba(156,234,254,.68);
      --page-grad-violet:rgba(200,141,221,.55);
      --page-grad-blue:rgba(167,211,246,.32);
      --page-detail-light:rgba(255,255,255,.095);
      --page-detail-cool:rgba(89,139,178,.045);
      --page-detail-violet:rgba(139,104,176,.038);
      --page-detail-soft:rgba(255,255,255,.052);
      --page-detail-line-a:rgba(255,255,255,.030);
      --page-detail-line-b:rgba(111,133,173,.022);
      --page-atmosphere:
        radial-gradient(ellipse 23% 11% at 18% 23%,var(--page-detail-light) 0%,transparent 70%),
        radial-gradient(ellipse 16% 25% at 43% 54%,var(--page-detail-cool) 0%,transparent 72%),
        radial-gradient(ellipse 21% 10% at 77% 31%,var(--page-detail-soft) 0%,transparent 70%),
        radial-gradient(ellipse 25% 15% at 62% 77%,var(--page-detail-violet) 0%,transparent 74%),
        linear-gradient(112deg,transparent 18%,var(--page-detail-line-a) 33%,transparent 47%,var(--page-detail-line-b) 62%,transparent 79%),
        radial-gradient(circle at 15% 40%,var(--page-grad-cyan) 0%,transparent 55%),
        radial-gradient(circle at 85% 60%,var(--page-grad-violet) 0%,transparent 55%),
        radial-gradient(circle at 50% 10%,var(--page-grad-blue) 0%,transparent 40%);
    }
    [data-theme="dark"]{
      --page-base:#050A12;
      --page-grad-cyan:rgba(85,195,255,.34);
      --page-grad-violet:rgba(181,112,218,.27);
      --page-grad-blue:rgba(85,195,255,.21);
      --page-detail-light:rgba(189,228,255,.038);
      --page-detail-cool:rgba(85,195,255,.065);
      --page-detail-violet:rgba(181,112,218,.035);
      --page-detail-soft:rgba(186,211,242,.026);
      --page-detail-line-a:rgba(189,228,255,.018);
      --page-detail-line-b:rgba(85,195,255,.016);
    }
    body,
    .liquid_glass-outer{
      background-image:var(--page-atmosphere);
      background-attachment:fixed;
      background-repeat:no-repeat;
    }

    /* Keep the accepted nav geometry; only reduce Dark's neon dominance. */
    [data-theme="dark"].is-light-sanctum-page .nav-title{
      text-shadow:
        -2px 0 8px rgba(85,195,255,.60),
         2px 0 8px rgba(200,141,221,.60);
      box-shadow:
        0 4px 12px rgba(0,0,0,.60),
        -4px 0 12px rgba(85,195,255,.40),
         4px 0 12px rgba(200,141,221,.40),
        inset 0 0 6px rgba(255,255,255,.30);
    }

    /* Light action stays readable without becoming an opaque white pill. */
    .is-light-sanctum-page .action-btn{
      border-color:rgba(255,255,255,.62);
      background:rgba(255,255,255,.43);
    }
    @media (hover:hover) and (pointer:fine){
      .is-light-sanctum-page .action-btn:hover{
        background:rgba(255,255,255,.76);
        border-color:rgba(156,234,254,.78);
      }
    }

    /* Test-only version marker; remove the whole footer for formal release. */
    .is-light-sanctum-page .footer{font-size:0!important}
    .is-light-sanctum-page .footer::after{
      content:"Beta V21-P4F · 測試版。";
      display:inline;
      font-size:9px;
      line-height:1.5;
      color:inherit;
    }
    @media(max-width:720px){
      .is-light-sanctum-page .footer::after{font-size:8.3px}
    }
  </style>
</head>
