  </g>

  <g opacity=".72" filter="url(#smokeC)">
    <path d="M-20 1510 C180 1330 470 1360 620 1545 C760 1715 665 1920 420 1965 C190 2005 0 1860 -25 1680 C-35 1615 -30 1560 -20 1510Z" fill="url(#cyan)"/>
    <path d="M775 1460 C1010 1300 1290 1370 1440 1560 C1590 1750 1490 1980 1240 2020 C1000 2060 795 1915 760 1715 C745 1620 750 1525 775 1460Z" fill="url(#rose)"/>
    <path d="M360 2010 C590 1870 870 1915 980 2085 C1090 2255 940 2425 710 2440 C485 2455 300 2310 300 2165 C300 2105 320 2050 360 2010Z" fill="url(#violet)"/>
