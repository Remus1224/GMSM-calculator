<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#9de9ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef9cff" stop-opacity=".58"/>
      <stop offset=".55" stop-color="#c5a9ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8df0df" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#ffb4dd" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="smokeA" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency=".0045 .009" numOctaves="4" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="B" result="distorted"/>
      <feGaussianBlur in="distorted" stdDeviation="34"/>
    </filter>
    <filter id="smokeB" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".007 .0035" numOctaves="5" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="G" yChannelSelector="R" result="distorted"/>
      <feGaussianBlur in="distorted" stdDeviation="42"/>
    </filter>
    <filter id="smokeC" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="turbulence" baseFrequency=".003 .006" numOctaves="3" seed="47" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="105" xChannelSelector="B" yChannelSelector="G" result="distorted"/>
      <feGaussianBlur in="distorted" stdDeviation="28"/>
    </filter>
  </defs>

  <g opacity=".95" filter="url(#smokeA)">
    <path d="M-80 260 C160 80 390 160 520 340 C655 525 530 690 305 720 C70 750 -90 610 -80 260Z" fill="url(#cyan)"/>
    <path d="M1040 120 C1320 -20 1560 100 1660 340 C1725 500 1600 720 1365 735 C1130 750 960 570 1010 360 C1025 290 1030 205 1040 120Z" fill="url(#violet)"/>
