<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光之聖所祈禱模擬器｜iOS Top-Level Test</title>
</head>
<body style="margin:0;background:#000">
<script>
(async () => {
  const response = await fetch('./index.html?ios-top-level-source=1', { cache: 'no-store' });
  if (!response.ok) throw new Error('runtime index HTTP ' + response.status);
  let html = await response.text();

  const injectedStyle = `<style id="iosTopLevelTestStyle">
html,body.player-presentation{width:100%!important;height:100%!important;min-width:0!important;min-height:100dvh!important;overflow:hidden!important;background:#000!important}
body.player-presentation #fitArea{position:fixed!important;left:50%!important;top:50%!important;width:1280px!important;height:720px!important;transform-origin:center center!important;transform:translate(-50%,-50%) scale(var(--ios-stage-scale,1))!important}
body.player-presentation .embeddedFullscreenToggle{z-index:10000!important}
</style>`;

  const injectedScript = `<script>
(function(){
  function reflow(){
    var vv=window.visualViewport;
    var w=Math.max(1,vv?vv.width:window.innerWidth);
    var h=Math.max(1,vv?vv.height:window.innerHeight);
    var scale=Math.min(w/1280,h/720);
    document.documentElement.style.setProperty('--ios-stage-scale',String(scale));
  }
  window.__GMSM_IOS_TOP_LEVEL_TEST__=true;
  window.addEventListener('resize',reflow,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',reflow,{passive:true});
  document.addEventListener('DOMContentLoaded',function(){
    reflow();
    var button=document.getElementById('embeddedFullscreenToggle');
    if(button){
      button.setAttribute('aria-label','返回');
      button.title='返回';
      button.addEventListener('click',function(event){
        event.preventDefault();
        event.stopImmediatePropagation();
        if(history.length>1) history.back();
        else location.href='../';
      },true);
    }
  });
  reflow();
})();
<\/script>`;

  html = html.replace('</head>', injectedStyle + '</head>');
  html = html.replace('</body>', injectedScript + '</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(error => {
  document.body.textContent = 'iOS top-level test load failed: ' + error;
});
</script>
</body>
</html>
