name: 資料／公式問題
about: 回報遊戲改版、數值資料或計算公式可能不正確
title: "[Data/Formula] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        這個模板用於遊戲數值、機率、素材需求、公式或版本更新造成的差異。若只是畫面或操作異常，請使用「Bug 回報」。
  - type: dropdown
    id: tool
    attributes:
      label: 相關工具
      options:
        - 超越模擬器
        - 製作模擬器
        - 紋章模擬器
        - 飾品強化模擬器
        - 星力強化模擬器
        - 極限屬性計算機
        - 符文計算機
        - 無視防禦計算機
        - 六轉進度計算機
        - 創世解放計算機
        - HEXA 屬性模擬器
        - HEXA 懶人重製表
        - HEXA 重置決策模擬
        - HEXA 目標機率模擬
        - 其他
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: 遊戲版本／日期
      description: 若知道版本或更新日期請填寫。
      placeholder: 例如 2026/09/xx 更新後
  - type: textarea
    id: current
    attributes:
      label: 工具目前結果
      description: 請附輸入值與工具計算出的結果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 遊戲內實際結果或正確資料
      description: 請說明你認為正確的值，並附上可核對的來源或實測內容。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 證據／來源
      description: 可附遊戲截圖、官方公告、實測步驟或其他可核對資料。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他補充
  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 我已確認這不是單純的顯示或操作問題
          required: true
        - label: 我沒有在 Issue 中貼出帳號密碼、Token 或其他敏感資訊
          required: true
