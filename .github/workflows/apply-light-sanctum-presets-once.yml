name: Apply Light Sanctum Presets Once

on:
  push:
    branches:
      - feature/light-sanctum-pages
    paths:
      - '.github/workflows/apply-light-sanctum-presets-once.yml'
      - '.github/scripts/apply_light_sanctum_presets.py'

permissions:
  contents: write

jobs:
  apply-direct-beta-presets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/light-sanctum-pages
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply direct Preset 1 / 2 / 3 implementation
        run: python3 .github/scripts/apply_light_sanctum_presets.py

      - name: Validate direct Beta runtime
        run: |
          set -euo pipefail
          node --check beta/light-sanctum-pray/runtime/player-presentation.js
          grep -q 'MAPLEM_PRAY_PRESETS' beta/light-sanctum-pray/runtime/player-presentation.js
          grep -q 'gameplayState.presets=' beta/light-sanctum-pray/runtime/player-presentation.js
          grep -q 'function gameplaySwitchPreset' beta/light-sanctum-pray/runtime/player-presentation.js
          test ! -e beta/light-sanctum-pray/runtime/player-presentation-pages-loader.js
          test ! -e beta/light-sanctum-pray/runtime/preset-source-normalizer.js
          test ! -e beta/light-sanctum-pray/runtime/preset-status-bridge.js

      - name: Commit direct Beta implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta/light-sanctum-pray/runtime/player-presentation.js
          git commit -m 'feat: implement direct beta light sanctum presets'
          git push origin HEAD:feature/light-sanctum-pages
