name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "index.html"
            "script.js"
            "style.css"
            "craft-effects.js"
            "README.md"
            "LICENSE"
            "THIRD_PARTY_NOTICES.md"
            "1204/index.html"
            "1204/script.js"
            "1204/style.css"
            "light-sanctum-pray/index.html"
            "light-sanctum-pray/script.js"
            "light-sanctum-pray/style.css"
            "game-info/index.html"
            "game-info/script.js"
            "game-info/page.css"
            "Crystal-Treasure-Box/index.html"
            "Crystal-Treasure-Box/crystal-treasure-box.mjs"
            "Crystal-Treasure-Box/runtime/index.html"
            "assets/menu/icon_Crystal-Treasure-Box.png"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          # Validate all Crystal Treasure Box runtime modules as well as the wrapper.
          find Crystal-Treasure-Box -type f \( -name "*.js" -o -name "*.mjs" \) -print0 | while IFS= read -r -d "" file; do
            node --check "$file"
          done
          node --check script.js
          node --check craft-effects.js
          node --check 1204/script.js
          # Check the single shared module tree.
          for file in assets/js/*.js; do
            node --check "$file"
          done
          # Check the information pages and image export helper.
          node --check game-info/script.js
          node --check game-info/dom-export.js
          node --check .github/scripts/verify-formal-paths.cjs
          node --check light-sanctum-pray/script.js
          node --check light-sanctum-pray/sound-toggle.js
          node --check light-sanctum-pray/runtime/click-audio.js
          node --check light-sanctum-pray/runtime/confirm-bypass-parent.js
          node --check light-sanctum-pray/runtime/player-presentation.js
          node --check light-sanctum-pray/runtime/player-presentation-patch.js
          node --check light-sanctum-pray/runtime/site-bridge.js
          node --check light-sanctum-pray/runtime/pray-confirm-popup/confirm-bypass-popup.js
          node --check light-sanctum-pray/runtime/pray-confirm-popup/player.js

      - name: Verify formal entry paths and preserved prayer runtime
        run: node .github/scripts/verify-formal-paths.cjs
      - name: Verify Crystal Treasure Box entry
        run: node .github/scripts/verify-crystal-treasure-box.cjs
      - name: Verify generated Crystal Treasure Box bundle
        run: node Crystal-Treasure-Box/tools/verify-build.cjs
      - name: Check README links to local policy files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'THIRD_PARTY_NOTICES.md' README.md
          grep -q 'LICENSE' README.md
