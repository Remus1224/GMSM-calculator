<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共通樣式第二輪・修改前後</title><style>body{margin:0;padding:24px;background:#edf1f8;color:#202a3b;font:16px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto}h1{font-size:26px}section{margin:28px 0;padding:18px;background:white;border:1px solid #d8dfeb;border-radius:16px}h2{margin:0;font-size:20px}p{margin:8px 0 16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}figure{margin:0;min-width:0}figcaption{font-weight:700;margin-bottom:8px}img{display:block;width:100%;height:auto;border:1px solid #d8dfeb;box-sizing:border-box}a{color:#305aa3}@media(max-width:600px){body{padding:10px}.pair{gap:8px}section{padding:10px}}</style><main><h1>共通樣式第二輪・修改前後</h1><p>2026/10/05，同一瀏覽器、日間模式、相同預設輸入。完整畫面保留於 JPEG 原檔。此輪以共通化為主，靜態排列刻意保留；動畫差異需切換分頁觀察，靜態截圖無法呈現。截圖僅供使用者比較，未執行自動測試或圖片匯出驗證。</p><section><h2>符文計算機</h2><p>總計區接上共通數值排列；依卡片實際寬度調整分欄，修正窄寬度數量逐字換行與重疊。內部分頁改用共通玻璃位移動畫。</p><div class="pair"><figure><figcaption>修改前 · <a href="rune-before.jpg" target="_blank">開啟原圖</a></figcaption><img src="rune-before.jpg" alt="符文計算機修改前"></figure><figure><figcaption>修改後 · <a href="rune-after.jpg" target="_blank">開啟原圖</a></figcaption><img src="rune-after.jpg" alt="符文計算機修改後"></figure></div></section><section><h2>六轉進度計算機</h2><p>資源統計接上共通格線與數字呈現，保留原有換行與欄位。</p><div class="pair"><figure><figcaption>修改前 · <a href="hexa-progress-before.jpg" target="_blank">開啟原圖</a></figcaption><img src="hexa-progress-before.jpg" alt="六轉進度計算機修改前"></figure><figure><figcaption>修改後 · <a href="hexa-progress-after.jpg" target="_blank">開啟原圖</a></figcaption><img src="hexa-progress-after.jpg" alt="六轉進度計算機修改後"></figure></div></section><section><h2>創世鍊成</h2><p>內部分頁改用共通位移動畫，移除私有動畫及方向計算。</p><div class="pair"><figure><figcaption>修改前 · <a href="genesis-before.jpg" target="_blank">開啟原圖</a></figcaption><img src="genesis-before.jpg" alt="創世鍊成修改前"></figure><figure><figcaption>修改後 · <a href="genesis-after.jpg" target="_blank">開啟原圖</a></figcaption><img src="genesis-after.jpg" alt="創世鍊成修改後"></figure></div></section></main></html>
